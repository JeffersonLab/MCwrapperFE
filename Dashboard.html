{
    var info = document.getElementById("headerInfo");
    info.className = info.className.replace(/\btab-(globe|graphs)\b/g, "").trim() + " tab-" + which;
    document.getElementById("tabGlobeBtn").className = which === "globe" ? "active" : "";
    document.getElementById("tabGraphsBtn").className = which === "graphs" ? "active" : "";

    window.dispatchEvent(new Event("resize"));
}

// ---- per-project "where did my jobs run" globe view ----
var GEO_POLL_MS = 5000; // same cadence as the Attempts table reload
var GEO_ALL_POLL_MS = 15000; // ~one FastOverlord pass; faster only re-reads unchanged data
var GEO_EVERYTHING_POLL_MS = 24 * 3600 * 1000; // snapshot is rebuilt daily
var GEO_ALL_MAX_STREAMERS = 400; // beyond this, smaller routes only get bars
var GEO_COLORS = { running: 0x3399ff, succeeded: 0x33dd55, failed: 0xff3333, mixed: 0xff9900, other: 0x999999 };
var GEO_SUBMIT_COLOR = 0xffffff, GEO_DEFAULT_ORIGIN_COLOR = 0xffee55;
// projID is a project number, -1 (none), "all" (active projects) or "everything" (daily whole-DB snapshot)
var projGeo = { projID: -1, req: 0, timer: null, inflight: false, origin: null, originKey: null, sites: {}, routes: {}, lastData: null };
var geoLegendCollapsed = false;

function GeoSiteState(s)
{
    if(s.running > 0) return "running";
    if(s.succeeded > 0 && s.failed > 0) return "mixed";
    if(s.failed > 0) return "failed";
    if(s.succeeded > 0) return "succeeded";
    return "other";
}

function GeoHex(c)
{
    return "#" + ("000000" + c.toString(16)).slice(-6);
}

// packet rate scales linearly with running jobs, from 0.2/s up to 2.5/s at the busiest route
function GeoPacketInterval(running, maxRunning)
{
    var rate = 0.2 + 2.3 * (running > 0 ? running : 0) / Math.max(1, maxRunning);
    return 1000 / rate;
}

// tolerate a cached globe.js without setRate
function GeoSetRate(arc, ms)
{
    if(arc && arc.setRate)
        arc.setRate(ms);
}

function ShowProjectGeo(projID)
{
    InitGlobe();
    if(!globe)
        return;
    projID = parseInt(projID);
    if(projGeo.projID !== projID)
        StartGeo(projID, GEO_POLL_MS, "Locating jobs for project " + projID + "...");
    PollProjectGeo();
}

function ShowAllGeo()
{
    InitGlobe();
    if(!globe)
        return;
    if(projGeo.projID !== "all")
    {
        StartGeo("all", GEO_ALL_POLL_MS, "Gathering job locations for all active projects (this may take a while)...");
        globe.setAutoRotate(true);
    }
    PollProjectGeo();
}

function ShowEverythingGeo()
{
    InitGlobe();
    if(!globe)
        return;
    if(projGeo.projID !== "everything")
    {
        StartGeo("everything", GEO_EVERYTHING_POLL_MS, "Loading the all-projects snapshot...");
        globe.setAutoRotate(true);
    }
    PollProjectGeo();
}

function StartGeo(projID, pollMs, message)
{
    projGeo.projID = projID;
    projGeo.req++;
    projGeo.inflight = false;
    projGeo.origin = null;
    projGeo.originKey = null;
    projGeo.sites = {};
    projGeo.routes = {};
    globe.clearOverlay();
    globe.setPointsVisible(false);
    SetGeoLegend(null, message);
    if(projGeo.timer)
        clearInterval(projGeo.timer);
    projGeo.timer = setInterval(PollProjectGeo, pollMs);
}

function PollProjectGeo()
{
    if(projGeo.projID === -1 || projGeo.inflight)
        return;
    var projID = projGeo.projID;
    var isAll = projID === "all" || projID === "everything";
    var name = projID === "everything" ? "all projects" : isAll ? "all active projects" : "project " + projID;
    var reqID = ++projGeo.req;
    projGeo.inflight = true;
    var repollMs = null; // set when the server still has IPs to locate
    $.ajax({ url: "./php/projectGeo.php", data: {projID: projID}, dataType: "json", timeout: isAll ? 180000 : 30000 })
        .done(function(data){
            if(reqID !== projGeo.req)
                return;
            if(data && data.lookup && data.unlocated && data.unlocated.pending > 0)
            {
                // one ip-api batch per request: come straight back for the next one, or wait out a rate-limit window
                repollMs = Math.min(65000, Math.max(300, (data.lookup.retry_after || 0) * 1000));
                if(data.lookup.error)
                    console.log("projectGeo lookup:", data.lookup);
            }
            if(data && !data.error && isAll && data.mode === "all")
                RenderAllGeo(data);
            else if(data && !data.error && !isAll && data.origin)
                RenderProjectGeo(data);
            else if(!projGeo.origin && projGeo.originKey === null)
                SetGeoLegend(null, "Could not locate jobs for " + name + ".");
        })
        .fail(function(){
            if(reqID === projGeo.req && !projGeo.origin && projGeo.originKey === null)
                SetGeoLegend(null, "Could not load job locations for " + name + ".");
        })
        .always(function(){
            if(reqID === projGeo.req)
            {
                projGeo.inflight = false;
                if(repollMs !== null)
                    setTimeout(function(){ if(projGeo.projID === projID) PollProjectGeo(); }, repollMs);
            }
        });
}

function ClearProjectGeo()
{
    projGeo.projID = -1;
    projGeo.req++;
    projGeo.inflight = false;
    projGeo.origin = null;
    projGeo.originKey = null;
    projGeo.sites = {};
    projGeo.routes = {};
    if(projGeo.timer)
    {
        clearInterval(projGeo.timer);
        projGeo.timer = null;
    }
    if(globe)
    {
        globe.clearOverlay();
        globe.setPointsVisible(true);
        globe.setAutoRotate(true);
    }
    $("#globeLegend").remove();
}

// job-weighted midpoint of the submit location and the run sites, so the streamers are in view
function GeoFocusPoint(origin, sites)
{
    var d2r = Math.PI / 180;
    function vec(lat, lon, w) { return [w*Math.cos(lat*d2r)*Math.cos(lon*d2r), w*Math.cos(lat*d2r)*Math.sin(lon*d2r), w*Math.sin(lat*d2r)]; }
    var total = 0;
    for(var i=0;i<sites.length;i++) total += sites[i].jobs;
    var v = vec(origin.lat, origin.lon, 1);
    for(var i=0;i<sites.length;i++)
    {
        var s = vec(sites[i].lat, sites[i].lon, sites[i].jobs / total);
        v[0] += s[0]; v[1] += s[1]; v[2] += s[2];
    }
    if(Math.sqrt(v[0]*v[0] + v[1]*v[1] + v[2]*v[2]) < 0.2)
        return origin;
    return { lat: Math.atan2(v[2], Math.sqrt(v[0]*v[0] + v[1]*v[1])) / d2r, lon: Math.atan2(v[1], v[0]) / d2r };
}

function RenderProjectGeo(data)
{
    var o = data.origin;
    var sites = data.sites || [];
    var originChanged = !projGeo.origin || projGeo.origin.lat != o.lat || projGeo.origin.lon != o.lon;
    if(originChanged)
    {
        // e.g. submit IP lookup finished after a default origin was shown: replay from the real origin
        globe.clearOverlay();
        projGeo.sites = {};
        projGeo.origin = { lat: o.lat, lon: o.lon };
        globe.pulseAt(o.lat, o.lon, o["default"] ? GEO_DEFAULT_ORIGIN_COLOR : GEO_SUBMIT_COLOR);
        var f = GeoFocusPoint(projGeo.origin, sites);
        globe.focusOn(f.lat, f.lon);
    }

    var maxJobs = 1, maxRunning = 0;
    for(var i=0;i<sites.length;i++)
    {
        maxJobs = Math.max(maxJobs, sites[i].jobs);
        maxRunning = Math.max(maxRunning, sites[i].running);
    }

    var step = sites.length ? Math.min(150, 3000 / sites.length) : 0;
    var launched = 0;
    var seen = {};
    for(var i=0;i<sites.length;i++)
    {
        var s = sites[i];
        var id = s.lat.toFixed(1) + "," + s.lon.toFixed(1);
        if(seen[id])
            continue;
        seen[id] = true;
        var state = { lat: s.lat, lon: s.lon, h: 8 + 100 * Math.sqrt(s.jobs / maxJobs), hex: GEO_COLORS[GeoSiteState(s)] };
        state.color = new THREE.Color(state.hex);

        var prev = projGeo.sites[id];
        if(prev)
        {
            state.arc = prev.arc;
            projGeo.sites[id] = state;
            if(state.arc && prev.hex !== state.hex)
                state.arc.setColor(state.hex);
            GeoSetRate(state.arc, GeoPacketInterval(s.running, maxRunning));
            if(globe.hasBar(id))
                globe.setBar(id, s.lat, s.lon, state.h, state.color);
            continue;
        }
        projGeo.sites[id] = state;
        (function(id){
            state.arc = globe.launch(projGeo.origin, s, 600 + step * launched++, state.hex, function(){
                var cur = projGeo.sites[id];
                if(cur)
                    globe.setBar(id, cur.lat, cur.lon, cur.h, cur.color);
            });
            GeoSetRate(state.arc, GeoPacketInterval(s.running, maxRunning));
        })(id);
    }
    for(var id in projGeo.sites)
    {
        if(!seen[id])
        {
            if(projGeo.sites[id].arc)
                projGeo.sites[id].arc.stop();
            delete projGeo.sites[id];
            globe.removeBar(id);
        }
    }
    SetGeoLegend(data, null);
}

function GeoLandBar(id)
{
    var s = projGeo.sites[id];
    if(s)
        globe.setBar(id, s.lat, s.lon, s.h, s.color);
}

function RenderAllGeo(data)
{
    var origins = data.origins || [], sites = data.sites || [], routes = data.routes || [];
    var originKey = origins.map(function(o){ return o.cell + (o["default"] ? "d" : ""); }).sort().join(";");
    if(projGeo.originKey !== originKey)
    {
        // new project or newly resolved submit IP: replay everything
        globe.clearOverlay();
        projGeo.sites = {};
        projGeo.routes = {};
        projGeo.originKey = originKey;
        for(var i=0;i<origins.length;i++)
            globe.pulseAt(origins[i].lat, origins[i].lon, origins[i]["default"] ? GEO_DEFAULT_ORIGIN_COLOR : GEO_SUBMIT_COLOR);
    }

    var maxJobs = 1;
    for(var i=0;i<sites.length;i++)
        maxJobs = Math.max(maxJobs, sites[i].jobs);
    var newSites = {};
    for(var i=0;i<sites.length;i++)
    {
        var s = sites[i];
        var hex = GEO_COLORS[GeoSiteState(s)];
        newSites[s.cell] = { lat: s.lat, lon: s.lon, h: 8 + 100 * Math.sqrt(s.jobs / maxJobs), hex: hex, color: new THREE.Color(hex) };
    }
    for(var id in projGeo.sites)
        if(!newSites[id])
            globe.removeBar(id);
    projGeo.sites = newSites;
    for(var id in newSites)
        if(globe.hasBar(id))
            GeoLandBar(id);

    var seen = {};
    for(var i=0;i<routes.length;i++)
        seen[routes[i].origin + ">" + routes[i].site] = true;
    var arcs = 0;
    for(var id in projGeo.routes)
    {
        if(!seen[id])
        {
            if(projGeo.routes[id].arc)
                projGeo.routes[id].arc.stop();
            delete projGeo.routes[id];
        }
        else if(projGeo.routes[id].arc)
            arcs++;
    }

    var step = routes.length ? Math.min(150, 4000 / Math.min(routes.length, GEO_ALL_MAX_STREAMERS)) : 0;
    var launched = 0, maxRunning = 0;
    for(var i=0;i<routes.length;i++)
        maxRunning = Math.max(maxRunning, routes[i].running);
    for(var i=0;i<routes.length;i++)
    {
        var r = routes[i];
        var id = r.origin + ">" + r.site;
        var hex = GEO_COLORS[GeoSiteState(r)];
        var rate = GeoPacketInterval(r.running, maxRunning);
        var prev = projGeo.routes[id];
        if(prev)
        {
            if(prev.arc && prev.hex !== hex)
                prev.arc.setColor(hex);
            GeoSetRate(prev.arc, rate);
            prev.hex = hex;
            continue;
        }
        if(arcs >= GEO_ALL_MAX_STREAMERS)
        {
            projGeo.routes[id] = { arc: null, hex: hex };
            if(!globe.hasBar(r.site))
                GeoLandBar(r.site);
            continue;
        }
        arcs++;
        (function(site){
            projGeo.routes[id] = { hex: hex, arc: globe.launch(r.from, r.to, 600 + step * launched++, hex, function(){
                if(!globe.hasBar(site))
                    GeoLandBar(site);
            }) };
            GeoSetRate(projGeo.routes[id].arc, rate);
        })(r.site);
    }
    SetGeoLegend(data, null);
}

function SetGeoLegend(data, message)
{
    if(data)
        projGeo.lastData = data;
    var globe3d = document.getElementById("globe");
    if(!globe3d)
        return;
    globe3d.style.position = "relative";
    var legend = document.getElementById("globeLegend");
    if(!legend)
    {
        legend = document.createElement("div");
        legend.id = "globeLegend";
        // the legend sits inside the globe container: keep its clicks from reaching the globe's drag handler,
        // which would stop the auto-rotation
        legend.addEventListener("mousedown", function(e){ e.stopPropagation(); }, false);
        legend.style.cssText = "position:absolute;top:8px;left:8px;z-index:2;max-width:45%;padding:6px 10px;" +
            "background:rgba(0,0,0,0.65);border:1px solid #444;border-radius:4px;color:#fff;font:12px/16px Arial,sans-serif;";
        globe3d.appendChild(legend);
    }
    $(legend).empty();
    function line(text, css)
    {
        var d = document.createElement("div");
        d.textContent = text;
        if(css) d.style.cssText = css;
        legend.appendChild(d);
    }

    if(message)
    {
        line(message);
    }
    else
    {
        var sites = data.sites || [];
        var located = 0, running = 0, succeeded = 0, failed = 0;
        for(var i=0;i<sites.length;i++) { located += sites[i].jobs; running += sites[i].running; succeeded += sites[i].succeeded; failed += sites[i].failed; }

        var toggle = document.createElement("span");
        toggle.textContent = geoLegendCollapsed ? "[+]" : "[\u2212]";
        toggle.title = geoLegendCollapsed ? "Expand" : "Minimize";
        toggle.style.cssText = "float:right;margin-left:10px;cursor:pointer;color:#aaa";
        toggle.onclick = function(){ geoLegendCollapsed = !geoLegendCollapsed; SetGeoLegend(projGeo.lastData, null); };
        legend.appendChild(toggle);

        var isAll = data.mode === "all";
        var title = data.scope === "everything" ? "All projects (" + data.project_count + ")"
            : isAll ? "All active projects (" + data.project_count + ")" : "Project " + data.projID;
        line(title + ": " + located + " of " + data.total_jobs + " jobs located", "font-weight:bold");
        if(geoLegendCollapsed)
            return;
        if(data.generated)
            line("Snapshot from " + data.generated, "color:#aaa");
        line(running + " running, " + succeeded + " succeeded, " + failed + " failed");

        var key = document.createElement("div");
        var keyItems = [["running", "running"], ["succeeded", "success"], ["failed", "failure"], ["mixed", "both"]];
        for(var i=0;i<keyItems.length;i++)
        {
            var sw = document.createElement("span");
            sw.textContent = "\u25A0 " + keyItems[i][1] + "  ";
            sw.style.color = GeoHex(GEO_COLORS[keyItems[i][0]]);
            key.appendChild(sw);
        }
        legend.appendChild(key);

        if(isAll)
        {
            var origins = data.origins || [], defProj = 0;
            for(var i=0;i<origins.length;i++) defProj += origins[i].default_projects;
            line("Pulses: " + origins.length + " submit location" + (origins.length == 1 ? "" : "s"), "color:" + GeoHex(GEO_SUBMIT_COLOR));
            if(defProj)
                line(defProj + " project" + (defProj == 1 ? "" : "s") + " without a locatable submit IP shown at Jefferson Lab", "color:" + GeoHex(GEO_DEFAULT_ORIGIN_COLOR));
        }
        else
        {
            var o = data.origin;
            var originText = {
                "ok": "Pulse: submit location",
                "null": "Submit IP not recorded; pulse at " + o.label,
                "internal": "Submit IP is internal; pulse at " + o.label,
                "unresolved": "Submit IP could not be geolocated; pulse at " + o.label,
                "pending": "Submit location lookup pending; pulse at " + o.label
            }[o.ip_status] || ("Pulse at " + o.label);
            line(originText, "color:" + GeoHex(o["default"] ? GEO_DEFAULT_ORIGIN_COLOR : GEO_SUBMIT_COLOR));
        }

        if(sites.length == 0)
            line("No job run locations available yet.", "color:#aaa");
        for(var i=0;i<Math.min(6, sites.length);i++)
        {
            var s = sites[i], counts = [];
            if(s.running) counts.push(s.running + " running");
            if(s.succeeded) counts.push(s.succeeded + " ok");
            if(s.failed) counts.push(s.failed + " failed");
            line((s.label || (s.lat.toFixed(1) + ", " + s.lon.toFixed(1))) + ": " + s.jobs + " jobs" + (counts.length ? " (" + counts.join(", ") + ")" : ""),
                "color:" + GeoHex(GEO_COLORS[GeoSiteState(s)]));
        }
        if(sites.length > 6)
            line("+ " + (sites.length - 6) + " more sites", "color:#aaa");

        var u = data.unlocated || {};
        var names = { waiting: "not started", no_ip: "no IP recorded", internal: "internal IP", unresolved: "unresolvable", pending: "lookup pending" };
        var parts = [];
        for(var k in names)
            if(u[k] > 0) parts.push(u[k] + " " + names[k]);
        if(parts.length)
            line("Not shown: " + parts.join(", "), "color:#aaa");
    }

    var back = document.createElement("a");
    back.href = "#";
    var fromProject = typeof projGeo.projID === "number" && projGeo.projID >= 0;
    back.textContent = fromProject ? "Show all active projects" : "Show all submissions";
    back.style.cssText = "color:#66ccff;display:inline-block;margin-top:4px";
    back.onclick = function(e){ e.preventDefault(); if(fromProject) ShowAllGeo(); else ClearProjectGeo(); };
    legend.appendChild(back);
}

function getTimestampFromDate(date_str)
{

    return d.getTime()
}

function StatusLight(light_name,poll_table,cron_freq)
{
    var LED=document.getElementById(light_name);
    if(!LED || poll_table.length==0)
    {
        return;
    }
    //DO MOVER
    Running=0;
    Now=Date.now();
    Recent=false;
    for(var i=0;i<poll_table.length;i++)
    {

        //console.log(hist_table.MCOverlord[i].StartTime)
        //console.log(Date.parse(hist_table.MCOverlord[i].StartTime))
        if(poll_table[i].Status=="Success" || poll_table[i].Status=="Running" )
        {
            Running+=1;
        }

                        
    }
    if(Now-getTimestampFromDate(poll_table[0].StartTime)<2*cron_freq*60*1000 || poll_table[0].Status=="Running")
        Recent=true;


    if(poll_table[0].Status=="Running")
    {
        if(LED.className != "led-blink-green" )
            { LED.className="led-blink-green"}
        else
            {LED.className="led-green" }
    }
    else if(Recent && Running == 5)
    {
        LED.className="led-green";
    }
    else if(Recent==false)
    {
        LED.className="led-red"
    }
    else{
        if(poll_table[0].Status=="Running" && LED.className != "led-blink-green")
        {
            LED.className="led-blink-green"
        }
        else if(hist_table.MCMover[0].Status!="Running")
        {
            LED.className="led-red-blinking"
        }
    }
}

  function DecodeGeos()
  {
    
        if (window.XMLHttpRequest) {

            xmlhttp = new XMLHttpRequest();
        } else {
            // code for IE6, IE5
            xmlhttp = new ActiveXObject("Microsoft.XMLHTTP");

                console.log("decodeGeo.php HTTP status:", this.status);

                if(this.status == 200) {
                    if(this.responseText != "")
                    {
                        try {
                            var parsed=JSON.parse(this.responseText);
                            // handle both plain array and debug wrapper
                            if(parsed && parsed.debug) {
                                console.log("decodeGeo debug:", parsed.debug);
                                ipTable = parsed.data || [];

                            }

                            console.error("Raw response was:", this.responseText.substring(0,1000));
                            ipTable=[];
                        }
                        console.log("ipTable:", ipTable)
                        SetSceneGlobe();
                    }
                } else {
                    console.error("decodeGeo.php failed with status "+this.status+": "+this.responseText.substring(0,500));
                    SetSceneGlobe(); // still render globe without points
                }
            }
        };

function disposeNode (node)
{
    if (node instanceof THREE.Mesh)
    {
        if (node.geometry)
        {
            node.geometry.dispose ();
        }

        if (node.material)
        {
            if (node.material instanceof THREE.MeshFaceMaterial)
            {
                $.each (node.material.materials, function (idx, mtrl)
                {
                    if (mtrl.map)           mtrl.map.dispose ();
                    if (mtrl.lightMap)      mtrl.lightMap.dispose ();
                    if (mtrl.bumpMap)       mtrl.bumpMap.dispose ();
                    if (mtrl.normalMap)     mtrl.normalMap.dispose ();
                    if (mtrl.specularMap)   mtrl.specularMap.dispose ();
                    if (mtrl.envMap)        mtrl.envMap.dispose ();

                    mtrl.dispose ();    // disposes any programs associated with the material
                });
            }
            else
            {
                if (node.material.map)          node.material.map.dispose ();
                if (node.material.lightMap)     node.material.lightMap.dispose ();
                if (node.material.bumpMap)      node.material.bumpMap.dispose ();
                if (node.material.normalMap)    node.material.normalMap.dispose ();
                if (node.material.specularMap)  node.material.specularMap.dispose ();
                if (node.material.envMap)       node.material.envMap.dispose ();

                node.material.dispose ();   // disposes any programs associated with the material
            }
        }
    }
}   // disposeNode

function disposeHierarchy (node, callback)
{
    if(node)
    {
        if(node.children)
        {
            for (var i = node.children.length - 1; i >= 0; i--)
            {
                var child = node.children[i];
                disposeHierarchy (child, callback);
                callback (child);
            }
        }
        else{
            disposeNode(node);
        }
    }
}
